name: Unpack deployment package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack backend package
        run: |
          base64 -d package.b64 > /tmp/qinyi-api.zip
          unzip -q /tmp/qinyi-api.zip -d /tmp/qinyi-api
          cp -a /tmp/qinyi-api/qinyi-ai-support-api/. .
          rm package.b64
      - name: Commit deployed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy backend package"
          git push
